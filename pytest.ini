# pytest.ini
# Configuration file for pytest

[tool:pytest]
minversion = 6.0
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers
markers =
    unit: Unit tests - fast, isolated tests
    integration: Integration tests - test component interaction
    performance: Performance tests - may take longer to run
    slow: Slow tests - long-running tests (>30s)
    smoke: Smoke tests - basic functionality verification
    regression: Regression tests - prevent known issues
    load: Load tests - high resource usage tests

# Test discovery
addopts = 
    --strict-markers
    --strict-config
    --verbose
    --tb=short
    --durations=10
    --color=yes
    --maxfail=3

# Coverage configuration
addopts = 
    --cov=car_sales_dashboard
    --cov-branch
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-report=xml:coverage.xml
    --cov-fail-under=70

# Timeout configuration
timeout = 30
timeout_method = thread

# Parallel execution
addopts = -n auto

# Warning filters
filterwarnings =
    ignore::UserWarning
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    error::FutureWarning

# Logging configuration
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

log_file = tests/logs/pytest.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)8s] %(filename)s:%(lineno)d: %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

# Test output
console_output_style = progress

# Doctest configuration
doctest_optionflags = NORMALIZE_WHITESPACE IGNORE_EXCEPTION_DETAIL

# Custom test collection
collect_ignore = [
    "setup.py",
    "conftest.py",
    "build",
    "dist",
    ".tox",
    ".pytest_cache",
    "__pycache__"
